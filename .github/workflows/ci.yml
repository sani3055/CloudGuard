name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cloudguard-lambda

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov
          
      - name: Run test suite
        run: |
          pytest tests/ -v

  build-and-push:
    name: Build & Deploy to ECR/Lambda
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f backend/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to Lambda
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # The Lambda function will only be updated if it already exists (Terraform has created it).
          if aws lambda get-function --function-name CloudGuard-Detection > /dev/null 2>&1; then
            echo "Lambda found. Updating function code..."
            aws lambda update-function-code \
              --function-name CloudGuard-Detection \
              --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:latest
            aws lambda wait function-updated --function-name CloudGuard-Detection
            echo "Deployment successful."
          else
            echo "Skipping update: Lambda function CloudGuard-Detection does not exist yet."
            echo "You must run Terraform apply first to provision the infrastructure."
          fi
